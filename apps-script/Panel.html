<script>
/* Finanzas · Panel lateral de edición (se abre con el lápiz ✎, F4 o clic derecho → Editar).
 *  - Concepto: nombre, categoría, monto del mes elegido, vencimiento (día 1–28, último / anteúltimo día,
 *    hábil o no, con las fechas que resultan), medio de pago y meses futuros.
 *  - Categoría: nombre, color, cómo suma (ingreso / gasto / ahorro) y eliminar. */
var AYUDA_REP = {
  todos: 'Los meses siguientes se completan solos (en gris) hasta que cargues el monto real.',
  algunos: 'Solo en los meses marcados, por ejemplo el aguinaldo en junio y diciembre.',
  no: 'Solo cuenta lo que cargues a mano en cada mes.'
};
var CLASES_CAT = [['I', 'Ingreso'], ['G', 'Gasto'], ['A', 'Ahorro']];
var PANEL = { modo: null, c: null, cat: null, timer: null, vence: null, tocado: false, color: '', clase: '' };

/** Monto para mostrar en el panel: la cuenta ("=100+50") o el número con separador de miles. */
function montoPanel(v) {
  if (!v) return '';
  return v.c && /[-+*/()%]/.test(v.c.slice(1)) ? '=' + v.c : Number(v.m).toLocaleString('es-AR', { maximumFractionDigits: 2 });
}

function mostrarPanel(color, titulo, sub, html) {
  var p = $('panel');
  p.style.setProperty('--cat', color);
  $('pTitulo').textContent = titulo;
  $('pSub').textContent = sub;
  $('pCuerpo').innerHTML = html;
  p.hidden = false;
  document.body.classList.add('con-panel');
}

/* ---------- Concepto ---------- */
function abrirPanel(c) {
  clearTimeout(PANEL.timer);
  PANEL = { modo: 'concepto', c: c, cat: null, timer: null, vence: null, tocado: false };
  var fijo = c.tipo === 'fijo';
  var cats = S.categorias.filter(function (k) { return k.tipo === c.tipo; }).sort(function (a, b) { return a.orden - b.orden; });
  var v = celdaDe(c, S.mesFoco);
  var h = [];
  h.push('<label class="campo-p">Nombre<input id="pNombre" autocomplete="off" value="' + esc(c.nombre) + '"></label>');
  h.push('<label class="campo-p">Categoría<select id="pCat">' + cats.map(function (k) { return '<option' + (k.nombre === c.categoria ? ' selected' : '') + '>' + esc(k.nombre) + '</option>'; }).join('') + '</select></label>');
  var fx = fijo ? parsearFormulaP(c.formula) : null;
  PANEL.fx = fx;
  h.push('<div class="campo-p"><label for="pMonto">Monto de ' + esc(etiquetaMesP(S.mesFoco).toLowerCase()) + '</label>' +
    '<div class="monto-fx"><input id="pMonto" class="num" autocomplete="off" inputmode="decimal" placeholder="Vacío" value="' + esc(montoPanel(v)) + '">' +
    (fijo ? '<button type="button" class="boton-fx' + (fx ? ' activo' : '') + '" id="pFxBtn" title="Calcular con una fórmula: % de los ingresos, gastos + un monto, etc." aria-pressed="' + !!fx + '">ƒx</button>' : '') + '</div>' +
    '<span class="ayuda-p">' + (v ? (v.e ? (fx ? 'Calculado por la fórmula' : 'Estimado por el sistema') + ': si lo cambiás queda confirmado.' : 'Cargado por vos.') : 'Acepta cuentas: 1500+300, 150k, 12000*3.') + '</span>');
  if (fijo) {
    var bases = S.conceptos.filter(function (x) { return x.tipo === 'fijo' && !x.formula && x.id !== c.id; })
      .sort(function (a, b) { return grupoIdx(a.clase) - grupoIdx(b.clase) || a.orden - b.orden; });
    var baseSel = fx ? fx.base : (c.clase === 'I' ? (bases[0] && bases[0].id) : 'I');
    var opSel = fx ? fx.op : '%';
    var totales = (c.clase !== 'I' ? '<option value="I"' + (baseSel === 'I' ? ' selected' : '') + '>Total de ingresos</option>' : '') +
      (c.clase !== 'G' ? '<option value="G"' + (baseSel === 'G' ? ' selected' : '') + '>Total de gastos</option>' : '');
    h.push('<div class="fx-caja" id="pFx"' + (fx ? '' : ' hidden') + '>' +
      '<div class="fx-linea"><span class="fx-ico">ƒx</span><select id="pBase" aria-label="Sobre qué se calcula">' + totales +
      '<optgroup label="Un concepto">' + bases.map(function (x) { return '<option value="' + esc(x.id) + '"' + (x.id === baseSel ? ' selected' : '') + '>' + esc(x.nombre) + ' · ' + esc(x.categoria) + '</option>'; }).join('') + '</optgroup></select></div>' +
      '<div class="fx-linea"><select id="pOp" class="fx-op" aria-label="Operación">' +
        [['%', '× porcentaje'], ['+', '+ sumar'], ['-', '− restar']].map(function (o) { return '<option value="' + o[0] + '"' + (o[0] === opSel ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select>' +
      '<input id="pNum" type="text" inputmode="decimal" autocomplete="off" placeholder="20" value="' + esc(fx ? (fx.op === '%' ? String(fx.n).replace('.', ',') : Number(fx.n).toLocaleString('es-AR')) : '') + '"><span id="pUnidad" class="fx-unidad"></span></div>' +
      '<span class="ayuda-p fx-previa" id="pFxPrevia"></span>' +
      '<span class="ayuda-p">Desde el mes actual, cada mes se calcula solo. Si escribís un monto en una celda, ese mes queda con tu valor.</span>' +
      '<button type="button" class="mini" id="pFxQuitar">Quitar fórmula</button></div>');
  }
  h.push('</div>');
  if (fijo) {
    // ¿Cuándo se repite? · ¿Con qué monto?
    var repIni = c.meses === 'no' ? 'no' : c.meses ? 'algunos' : 'todos';
    var mesesIni = c.meses && c.meses !== 'no' ? c.meses.split(',').map(Number) : [];
    var aum = aumentoP(c.proyeccion);
    var proyIni = aum !== null ? 'aumento' : c.proyeccion;
    PANEL.rep = repIni; PANEL.meses = mesesIni;
    h.push('<div class="campo-p">¿Cuándo se repite?' +
      '<div class="seg-p seg-lleno" id="pRep">' + [['todos', 'Todos los meses'], ['algunos', 'Algunos meses'], ['no', 'No se repite']].map(function (o) {
        return '<button type="button" data-rep="' + o[0] + '" aria-pressed="' + (o[0] === repIni) + '">' + o[1] + '</button>';
      }).join('') + '</div>' +
      '<div class="meses-p" id="pMesesSel"' + (repIni === 'algunos' ? '' : ' hidden') + '>' + MESES_C.map(function (m, i) {
        return '<button type="button" data-mes="' + (i + 1) + '" aria-pressed="' + (mesesIni.indexOf(i + 1) >= 0) + '">' + m + '</button>';
      }).join('') + '</div>' +
      '<span class="ayuda-p" id="pRepInfo"></span></div>');
    var opcion = function (valor, titulo, ayuda, extra) {
      return '<label class="opcion-p"><input type="radio" name="pProy" value="' + valor + '"' + (valor === proyIni ? ' checked' : '') + '>' +
        '<span><b>' + titulo + '</b>' + (extra || '') + '<small>' + ayuda + '</small></span></label>';
    };
    h.push('<div class="campo-p" id="pMontoCampo">¿Con qué monto?<div class="opciones-p">' +
      opcion('Repetir', 'Igual al último', 'Repite el último monto que cargaste.') +
      opcion('Ajustar por inflación', 'Ajustado por inflación', 'Cada mes suma la inflación esperada (' + String(S.inflEsperada).replace('.', ',') + '% mensual).') +
      opcion('aumento', 'Aumento fijo', 'Cada mes sube ese porcentaje. Ej.: un alquiler que aumenta 5% por mes.',
        ' <span class="aum-p"><input id="pAum" type="text" inputmode="decimal" autocomplete="off" placeholder="5" value="' + (aum !== null ? String(aum).replace('.', ',') : '') + '">% por mes</span>') +
      opcion('Promedio 3 meses', 'Promedio de los últimos 3', 'Para gastos que varían mes a mes (luz, supermercado).') +
      '</div></div>');
  }
  if (fijo) {
    var sel = selectorDesdeRegla(c.vence);
    h.push('<div class="campo-p">' + esc(txtClase(c.clase).dia) +
      '<div class="vence-sel">' +
        '<label class="dia-sel"><span>Día</span><input id="pDia" type="number" min="1" max="28" step="1" inputmode="numeric" placeholder="—" value="' + esc(sel.dia) + '"' + (sel.fin ? ' disabled' : '') + '></label>' +
        '<label class="check"><input type="checkbox" id="pUlt"' + (sel.fin === 'ultimo' ? ' checked' : '') + '> Último día</label>' +
        '<label class="check"><input type="checkbox" id="pAnt"' + (sel.fin === 'anteultimo' ? ' checked' : '') + '> Anteúltimo día</label>' +
      '</div>' +
      '<label class="check habil"><input type="checkbox" id="pHabil"' + (sel.habil ? ' checked' : '') + '> <span><b>Hábil</b> <span class="ayuda-p" id="pHabilInfo"></span></span></label>' +
      (sel.otra ? '<span class="ayuda-p aviso-p">Regla actual: <b>' + esc(c.vence) + '</b>. Se mantiene mientras no elijas otra.</span>' : '') +
      '<span class="ayuda-p" id="pVenceInfo"></span></div>');
  }
  h.push('<label class="campo-p">Medio de pago<input id="pMedio" list="dlMedios" autocomplete="off" placeholder="Débito automático, Transferencia, Tarjeta VISA…" value="' + esc(c.medio) + '">' +
    '<span class="ayuda-p">Se muestra junto al nombre: Débito automático (DA), Transferencia (T), Efectivo (EF), Mercado Pago (MP), tarjetas (VISA, AMEX…).' +
    (fijo ? ' Con débito automático, el monto se confirma solo el día del vencimiento.' : '') + '</span></label>');
  if (fijo) {

  }
  mostrarPanel(catColor(buscarCat(c.categoria)), c.nombre, c.categoria + ' · ' + describirRepeticion(c), h.join(''));
  $('pEliminar').title = 'Eliminar la fila y sus montos';
  if (fijo) {
    textoHabil();
    mostrarFechasVence(c.vence ? { fechas: fechasGuardadas(c) } : { fechas: [] });
    var cambio = function () { PANEL.tocado = true; textoHabil(); clearTimeout(PANEL.timer); PANEL.timer = setTimeout(function () { probarVence(reglaElegida()); }, 250); };
    $('pDia').addEventListener('input', function () {
      var d = $('pDia').value;
      if (d !== '' && Number(d) > 28) $('pDia').value = 28;
      if (d !== '' && Number(d) < 1) $('pDia').value = 1;
      cambio();
    });
    $('pUlt').onchange = function () { if ($('pUlt').checked) $('pAnt').checked = false; $('pDia').disabled = $('pUlt').checked || $('pAnt').checked; cambio(); };
    $('pAnt').onchange = function () { if ($('pAnt').checked) $('pUlt').checked = false; $('pDia').disabled = $('pUlt').checked || $('pAnt').checked; cambio(); };
    $('pHabil').onchange = cambio;
    $('pRep').querySelectorAll('[data-rep]').forEach(function (b) { b.onclick = function () { PANEL.rep = b.dataset.rep; actualizarRepeticion(); }; });
    $('pMesesSel').querySelectorAll('[data-mes]').forEach(function (b) {
      b.onclick = function () {
        var n = Number(b.dataset.mes), i = PANEL.meses.indexOf(n);
        if (i >= 0) PANEL.meses.splice(i, 1); else PANEL.meses.push(n);
        PANEL.meses.sort(function (x, y) { return x - y; });
        actualizarRepeticion();
      };
    });
    $('pAum').addEventListener('focus', function () { $('pCuerpo').querySelector('input[name=pProy][value=aumento]').checked = true; });
    actualizarRepeticion();
    var mostrarFx = function (si) {
      $('pFx').hidden = !si; actualizarRepeticion();
      $('pFxBtn').classList.toggle('activo', si); $('pFxBtn').setAttribute('aria-pressed', String(si));
    };
    $('pFxBtn').onclick = function () {
      var abrir = $('pFx').hidden;
      mostrarFx(abrir);
      if (abrir) { if (!$('pNum').value) $('pNum').value = $('pOp').value === '%' ? '20' : ''; previaFx(); $('pNum').focus(); $('pNum').select(); }
    };
    $('pFxQuitar').onclick = function () { $('pNum').value = ''; mostrarFx(false); };
    $('pBase').onchange = previaFx; $('pOp').onchange = previaFx; $('pNum').oninput = previaFx;
    previaFx();
  }
  $('pNombre').focus();
  $('pNombre').select();
}

/** Muestra los meses (si es "Algunos meses"), la ayuda y oculta "¿Con qué monto?" si no se repite o hay fórmula. */
function actualizarRepeticion() {
  $('pRep').querySelectorAll('[data-rep]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.rep === PANEL.rep)); });
  $('pMesesSel').hidden = PANEL.rep !== 'algunos';
  $('pMesesSel').querySelectorAll('[data-mes]').forEach(function (b) { b.setAttribute('aria-pressed', String(PANEL.meses.indexOf(Number(b.dataset.mes)) >= 0)); });
  var info = AYUDA_REP[PANEL.rep];
  if (PANEL.rep === 'algunos' && PANEL.meses.length) info = 'Se completa solo en ' + mesesCortos(PANEL.meses.join(',')) + ', con el último monto que cargaste.';
  if (PANEL.rep === 'algunos' && !PANEL.meses.length) info = 'Marcá los meses en que se repite.';
  $('pRepInfo').textContent = info;
  $('pMontoCampo').hidden = PANEL.rep === 'no' || !$('pFx').hidden;
}

/** Número de la fórmula (acepta 20 · 12,5 · 1.000.000 · 1M · 150k). */
function numeroFx() {
  var t = $('pNum').value.trim();
  if (!t) return 0;
  var m = montoP(t);
  return m ? m.valor : NaN;
}

/** Muestra la unidad (% o $) y el resultado de la fórmula para el mes siguiente. */
function previaFx() {
  var op = $('pOp').value, n = numeroFx(), base = $('pBase').value;
  $('pUnidad').textContent = op === '%' ? '%' : '$';
  $('pNum').placeholder = op === '%' ? '20' : '1.000.000';
  var el = $('pFxPrevia');
  if (!(n > 0)) { el.textContent = ''; return; }
  var mes = S.mesFoco > S.mesHoy ? S.mesFoco : sumarMesP(S.mesHoy, 1);
  var b = null;
  if (base === 'I' || base === 'G') S.conceptos.forEach(function (x) { if (x.clase === base && !x.formula && x.id !== PANEL.c.id) { var v = celdaDe(x, mes); if (v) b = (b || 0) + v.m; } });
  else { var v = S.V[base] && S.V[base][mes]; b = v ? v.m : null; }
  if (b === null) { el.textContent = 'Sin datos de la base en ' + etiquetaMesP(mes).toLowerCase() + '.'; return; }
  var r = op === '%' ? b * n / 100 : op === '+' ? b + n : Math.max(0, b - n);
  el.innerHTML = 'En ' + esc(etiquetaMesP(mes).toLowerCase()) + ': <b>' + esc(pesos(r)) + '</b> (' + esc(pesos(b)) + (op === '%' ? ' × ' + String(n).replace('.', ',') + '%' : (op === '+' ? ' + ' : ' − ') + pesos(n)) + ')';
}

/** Regla que resulta del selector (la regla guardada, tal cual, mientras no se toque el selector). */
function reglaElegida() {
  var c = PANEL.c;
  if (!PANEL.tocado) return c.vence || '';
  return reglaDesdeSelector({ dia: $('pDia').value, fin: $('pUlt').checked ? 'ultimo' : $('pAnt').checked ? 'anteultimo' : '', habil: $('pHabil').checked });
}

function textoHabil() {
  var fin = $('pUlt').checked ? 'último' : $('pAnt').checked ? 'anteúltimo' : '';
  $('pHabilInfo').textContent = fin ? '(el ' + fin + ' día hábil del mes)' : '(si cae sábado, domingo o feriado, se paga el hábil siguiente)';
}

/** Las fechas ya calculadas para este concepto, desde el mes elegido. */
function fechasGuardadas(c) {
  var out = [];
  for (var k = 0; k < 4; k++) { var f = S.venc[c.id] && S.venc[c.id][sumarMesP(S.mesFoco, k)]; if (f) out.push(f); }
  return out;
}

function probarVence(regla) {
  if (!PANEL.c) return;
  if (!regla) { PANEL.vence = { fechas: [] }; mostrarFechasVence(PANEL.vence); return; }
  $('pVenceInfo').textContent = 'Calculando…';
  api('api_probarVence', regla, S.mesFoco).then(function (r) {
    if (!PANEL.c || reglaElegida() !== regla) return;
    PANEL.vence = r;
    mostrarFechasVence(r);
  }).catch(function (e) { $('pVenceInfo').textContent = e.message; });
}

function mostrarFechasVence(r) {
  var el = $('pVenceInfo');
  el.classList.toggle('error', !!r.error);
  if (r.error) { el.textContent = r.error; return; }
  if (!r.fechas.length) { el.textContent = 'Sin fecha: elegí un día o marcá último / anteúltimo.'; return; }
  el.innerHTML = esc(txtClase(PANEL.c.clase).Verbo) + ': ' + r.fechas.map(function (f) {
    return '<b>' + esc(MESES_P[Number(f.slice(5, 7)) - 1].slice(0, 3)) + ' (' + Number(f.slice(8)) + ')</b>';
  }).join(' · ');
}

function guardarConceptoPanel() {
  var c = PANEL.c;
  if (PANEL.vence && PANEL.vence.error) { aviso(PANEL.vence.error, true); return; }
  var campos = {};
  var nombre = $('pNombre').value.trim();
  if (!nombre) { aviso('El concepto necesita un nombre', true); $('pNombre').focus(); return; }
  if (nombre !== c.nombre) campos.nombre = nombre;
  if ($('pCat').value !== c.categoria) campos.categoria = $('pCat').value;
  if (c.tipo === 'fijo') { var regla = reglaElegida(); if (regla !== (c.vence || '')) campos.vence = regla; }
  if ($('pMedio').value.trim() !== (c.medio || '')) campos.medio = $('pMedio').value.trim();
  if (c.tipo === 'fijo') {
    if (PANEL.rep === 'algunos' && !PANEL.meses.length) { aviso('Marcá al menos un mes', true); return; }
    var meses = PANEL.rep === 'no' ? 'no' : PANEL.rep === 'algunos' ? PANEL.meses.join(',') : '';
    if (meses !== (c.meses || '')) campos.meses = meses;
    var elegido = $('pCuerpo').querySelector('input[name=pProy]:checked');
    var proy = elegido ? elegido.value : c.proyeccion;
    if (proy === 'aumento') {
      var a = montoP($('pAum').value);
      if (!a || !(a.valor > 0) || a.valor > 100) { aviso('Poné el aumento mensual en %, ej. 5', true); $('pAum').focus(); return; }
      proy = 'Aumento ' + a.valor + '%';
    }
    if (PANEL.rep !== 'no' && $('pFx').hidden && proy !== c.proyeccion) campos.proyeccion = proy;
  }
  if (c.tipo === 'fijo') {
    var n = numeroFx();
    if (!$('pFx').hidden && $('pNum').value.trim() !== '' && !(n > 0)) { aviso('Poné un número mayor a 0', true); $('pNum').focus(); return; }
    var formula = !$('pFx').hidden && n > 0 ? textoFormula($('pBase').value, $('pOp').value, n) : '';
    if (formula !== (c.formula || '')) campos.formula = formula;
  }
  var monto = $('pMonto').value.trim(), v = celdaDe(c, S.mesFoco);
  if (monto && !montoP(monto)) { aviso('No entendí el monto "' + monto + '"', true); $('pMonto').focus(); return; }
  var cambiaMonto = monto !== montoPanel(v) || (v && v.e && monto);
  cerrarPanel();
  if (cambiaMonto) aplicarCambios([{ c: c.id, mes: S.mesFoco, texto: monto }]);
  if (Object.keys(campos).length) guardarCampo(c, campos).then(function (r) { if (r && !campos.vence) aviso('✓ ' + (campos.nombre || c.nombre) + ' actualizado'); });
  else if (cambiaMonto) aviso('✓ Monto de ' + etiquetaMesP(S.mesFoco) + ' guardado');
}

/* ---------- Categoría ---------- */
function abrirPanelCategoria(cat) {
  clearTimeout(PANEL.timer);
  PANEL = { modo: 'categoria', c: null, cat: cat, timer: null, color: cat.color || S.colores[0], clase: cat.clase };
  var n = S.conceptos.filter(function (x) { return x.categoria === cat.nombre; }).length;
  var h = [];
  h.push('<label class="campo-p">Nombre<input id="pNombreCat" autocomplete="off" value="' + esc(cat.nombre) + '"></label>');
  h.push('<div class="campo-p">Color<div class="colores-p" id="pColores">' + S.colores.map(function (col) {
    return '<button type="button" class="color-p' + (col.toLowerCase() === PANEL.color.toLowerCase() ? ' activo' : '') + '" data-color="' + esc(col) + '" style="--cat:' + esc(col) + '" title="' + esc(col) + '" aria-label="Color ' + esc(col) + '"></button>';
  }).join('') + '<label class="color-libre" title="Otro color"><input type="color" id="pColorLibre" value="' + esc(/^#[0-9a-f]{6}$/i.test(PANEL.color) ? PANEL.color : '#2A78D6') + '"><span>Otro</span></label></div></div>');
  if (cat.tipo === 'fijo') {
    h.push('<div class="campo-p">Suma como<div class="seg-p" id="pClase">' + CLASES_CAT.map(function (o) {
      return '<button type="button" data-clase="' + o[0] + '" aria-pressed="' + (o[0] === cat.clase) + '">' + o[1] + '</button>';
    }).join('') + '</div><span class="ayuda-p">Define en qué total del resumen cuentan sus filas (Ingresos, Gastos o Ahorro e inversión).</span></div>');
  } else {
    h.push('<p class="ayuda-p">Categoría de gastos eventuales: cada gasto es una fila y no se repite en los meses siguientes.</p>');
  }
  h.push('<p class="ayuda-p">' + (n ? n + ' fila' + (n > 1 ? 's' : '') + '. Para eliminar la categoría, primero borrá o mové sus filas (clic derecho → Mover a otra categoría).' : 'No tiene filas: se puede eliminar.') + '</p>');
  mostrarPanel(catColor(cat), cat.nombre, 'Categoría · ' + n + ' fila' + (n === 1 ? '' : 's'), h.join(''));
  $('pEliminar').title = 'Eliminar la categoría';
  $('pColores').querySelectorAll('[data-color]').forEach(function (b) { b.onclick = function () { elegirColorPanel(b.dataset.color); }; });
  $('pColorLibre').oninput = function () { elegirColorPanel($('pColorLibre').value); };
  if ($('pClase')) $('pClase').querySelectorAll('[data-clase]').forEach(function (b) {
    b.onclick = function () { PANEL.clase = b.dataset.clase; $('pClase').querySelectorAll('[data-clase]').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); }); };
  });
  $('pNombreCat').focus();
  $('pNombreCat').select();
}

function elegirColorPanel(col) {
  PANEL.color = col;
  $('panel').style.setProperty('--cat', col);
  $('pColores').querySelectorAll('[data-color]').forEach(function (b) { b.classList.toggle('activo', b.dataset.color.toLowerCase() === col.toLowerCase()); });
}

function guardarCategoriaPanel() {
  var cat = PANEL.cat;
  var nombre = $('pNombreCat').value.trim();
  if (!nombre) { aviso('La categoría necesita un nombre', true); $('pNombreCat').focus(); return; }
  var p = { nombre: nombre, anterior: cat.nombre };
  if (PANEL.color && PANEL.color !== cat.color) p.color = PANEL.color;
  if (PANEL.clase && PANEL.clase !== cat.clase) p.clase = PANEL.clase;
  cerrarPanel();
  if (nombre === cat.nombre && !p.color && !p.clase) return;
  if (nombre !== cat.nombre && S.colapsadas[cat.nombre]) { S.colapsadas[nombre] = true; delete S.colapsadas[cat.nombre]; guardarPreferencias(); }
  operar('api_guardarCategoria', [p], '✓ Categoría ' + nombre + ' actualizada');
}

/* ---------- Común ---------- */
function guardarPanel() {
  if (PANEL.modo === 'concepto' && PANEL.c) guardarConceptoPanel();
  else if (PANEL.modo === 'categoria' && PANEL.cat) guardarCategoriaPanel();
}

function cerrarPanel() {
  clearTimeout(PANEL.timer);
  PANEL = { modo: null, c: null, cat: null, timer: null };
  $('panel').hidden = true;
  document.body.classList.remove('con-panel');
  $('grilla').focus({ preventScroll: true });
}

$('pGuardar').onclick = guardarPanel;
$('pCancelar').onclick = cerrarPanel;
$('pCerrar').onclick = cerrarPanel;
$('pEliminar').onclick = function () {
  if (PANEL.modo === 'concepto' && PANEL.c) { var c = PANEL.c; cerrarPanel(); eliminarFila(c); }
  else if (PANEL.modo === 'categoria' && PANEL.cat) {
    var cat = PANEL.cat, filas = S.conceptos.filter(function (x) { return x.categoria === cat.nombre; });
    if (filas.length) { eliminarCategoria({ cat: cat, conceptos: filas }); return; }
    cerrarPanel();
    eliminarCategoria({ cat: cat, conceptos: filas });
  }
};
$('panel').addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { e.preventDefault(); cerrarPanel(); }
  else if (e.key === 'Enter' && e.target.tagName !== 'BUTTON') { e.preventDefault(); guardarPanel(); }
  e.stopPropagation();
});
</script>
