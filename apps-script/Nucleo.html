<script>
// <nucleo>
/* Finanzas · núcleo de lógica del navegador (sin dependencias; se testea en Node). */
/* ---- Interpretación de texto libre (barra de carga rápida) ---- */
var MESES_P = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

function normP(s) {
  return String(s == null ? '' : s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim();
}

function numeroP(tok) {
  var s = String(tok).trim().toLowerCase(), mult = 1;
  if (/k$/.test(s)) { mult = 1e3; s = s.slice(0, -1); }
  else if (/(m|mm|palos?)$/.test(s)) { mult = 1e6; s = s.replace(/(mm|m|palos?)$/, ''); }
  if (s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  var n = Number(s);
  return isNaN(n) ? null : n * mult;
}

/** Igual que parsearMonto del servidor. */
function montoP(texto) {
  var s = String(texto == null ? '' : texto).replace(/\$/g, '').replace(/\s+/g, '').replace(/^=/, '').replace(/^\+/, '');
  if (!s || !/\d/.test(s)) return null;
  if (!/^[\d.,kKmM()+\-*/x×%]+$/.test(s.replace(/palos?/gi, ''))) return null;
  s = s.replace(/[x×]/g, '*');
  var toks = [], re = /(\d[\d.,]*(?:palos?|mm|k|m)?)|([+\-*/()%])/gi, m, pos = 0;
  while ((m = re.exec(s))) {
    if (m.index !== pos) return null;
    pos = re.lastIndex;
    if (m[1]) { var n = numeroP(m[1]); if (n === null) return null; toks.push(n); } else toks.push(m[2]);
  }
  if (pos !== s.length || !toks.length) return null;
  var i = 0;
  function expr() { var v = term(); while (toks[i] === '+' || toks[i] === '-') { var op = toks[i++], r = term(); v = op === '+' ? v + r : v - r; } return v; }
  function term() { var v = factor(); while (toks[i] === '*' || toks[i] === '/') { var op = toks[i++], r = factor(); v = op === '*' ? v * r : v / r; } return v; }
  function factor() {
    var t = toks[i++], v;
    if (t === '-') return -factor();
    if (t === '(') { v = expr(); if (toks[i++] !== ')') throw 0; } else if (typeof t === 'number') v = t; else throw 0;
    if (toks[i] === '%') { i++; v = v / 100; }
    return v;
  }
  var valor;
  try { valor = expr(); } catch (e) { return null; }
  if (i !== toks.length || !isFinite(valor)) return null;
  var esCuenta = toks.length > 2 && toks.some(function (t) { return typeof t === 'string' && t !== '%'; });
  return { valor: Math.round(valor * 100) / 100, cuenta: esCuenta ? toks.map(String).join('') : '' };
}

/** Busca conceptos fijos parecidos a la descripción. Devuelve los candidatos ordenados. */
function buscarItems(desc, items) {
  var d = normP(desc);
  if (d.length < 3) return [];
  var res = [];
  items.forEach(function (it) {
    var n = normP(it.nombre), p = 0;
    if (n === d) p = 100;
    else if (n.indexOf(d) === 0) p = 80;
    else if (d.indexOf(n) === 0 && n.length >= 3) p = 70;
    else if (new RegExp('(^|\\s)' + d.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).test(n)) p = 60;
    if (p) res.push({ it: it, p: p - n.length / 100 });
  });
  return res.sort(function (a, b) { return b.p - a.p; }).map(function (x) { return x.it; });
}

var MEDIOS_CLAVE = { visa: 'visa', amex: 'amex', master: 'master', mastercard: 'master', debito: 'debito', efectivo: 'efectivo', cash: 'efectivo', mp: 'mercado pago', mercadopago: 'mercado pago', transferencia: 'transferencia', transf: 'transferencia', tarjeta: 'tarjeta', naranja: 'naranja', cabal: 'cabal' };

/**
 * Interpreta "heladera 900k 6 cuotas visa" o "luz 89.423 oct".
 * @param {string} texto
 * @param {{hoy:string, items:Array, medios:Array, meses:Array}} ctx
 */
function interpretar(texto, ctx) {
  var t = ' ' + String(texto || '').trim() + ' ';
  var r = { desc: '', monto: null, montoTexto: '', cuotas: 1, medio: '', mes: '', fecha: '', candidatos: [], tipo: 'mov' };
  var m;
  // Cuotas: "6 cuotas", "en 6", "6c", "x6"
  if ((m = /\s(?:en\s+)?(\d{1,2})\s*(?:cuotas?|ctas?|c)(?=\s)/i.exec(t)) || (m = /\s(?:x|en\s)\s?(\d{1,2})(?=\s)/i.exec(t))) {
    r.cuotas = Math.max(1, Math.min(60, Number(m[1])));
    t = t.replace(m[0], ' ');
  }
  // Fecha: "hoy", "ayer", "20/9"
  var hoy = new Date(ctx.hoy + 'T12:00:00');
  if ((m = /\s(hoy|ayer|anteayer)(?=\s)/i.exec(t))) {
    var dd = new Date(hoy); dd.setDate(dd.getDate() - ({ hoy: 0, ayer: 1, anteayer: 2 })[normP(m[1])]);
    r.fecha = isoD(dd); t = t.replace(m[0], ' ');
  } else if ((m = /\s(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?(?=\s)/.exec(t))) {
    var y = m[3] ? (m[3].length === 2 ? 2000 + Number(m[3]) : Number(m[3])) : hoy.getFullYear();
    var f = new Date(y, Number(m[2]) - 1, Number(m[1]), 12);
    if (!m[3] && f > hoy && (f - hoy) > 60 * 864e5) f.setFullYear(y - 1);
    r.fecha = isoD(f); t = t.replace(m[0], ' ');
  }
  // Mes: "oct", "octubre", "mes que viene", "mes pasado"
  if ((m = /\s(mes que viene|proximo mes|próximo mes|mes pasado)(?=\s)/i.exec(t))) {
    var k = /pasado/.test(m[1]) ? -1 : 1;
    r.mes = isoM(new Date(hoy.getFullYear(), hoy.getMonth() + k, 1)); t = t.replace(m[0], ' ');
  } else {
    t = t.replace(/\s([a-záéíóú]{3,10})(\.?)(?=\s)/gi, function (all, w, punto, pos) {
      var n = normP(w);
      if (n === 'set') n = 'sep';
      // Nombre completo siempre; abreviatura ("oct") solo con punto o al final, para no confundir "mar del plata"
      var alFinal = !t.slice(pos + all.length).replace(/[\d.,+\-*/()%kmx$]+/gi, '').trim();
      var idx = MESES_P.findIndex(function (x) { return x === n || ((punto || alFinal) && n.length >= 3 && n.length <= 4 && x.indexOf(n) === 0); });
      if (idx < 0 || r.mes) return all;
      // El mes más cercano a hoy con ese nombre (entre -6 y +6 meses)
      var cand = [-1, 0, 1].map(function (dy) { return new Date(hoy.getFullYear() + dy, idx, 1); })
        .sort(function (a, b) { return Math.abs(a - hoy) - Math.abs(b - hoy); })[0];
      r.mes = isoM(cand);
      return ' ';
    });
  }
  // Medio de pago
  t = t.replace(/\s([a-záéíóú]+)(?=\s)/gi, function (all, w) {
    var clave = MEDIOS_CLAVE[normP(w)];
    if (!clave || r.medio) return all;
    var medio = (ctx.medios || []).filter(function (x) { return normP(x).indexOf(clave) >= 0; })[0];
    if (!medio) return all;
    r.medio = medio;
    return ' ';
  });
  // Monto: el último token numérico
  var toks = t.trim().split(/\s+/).filter(String);
  for (var i = toks.length - 1; i >= 0; i--) {
    var mm = montoP(toks[i]);
    if (mm && /\d/.test(toks[i]) && !/^\d{1,2}(er|ro|do|to|ra|da)$/i.test(toks[i])) {
      r.monto = mm; r.montoTexto = toks[i]; toks.splice(i, 1); break;
    }
  }
  r.desc = toks.join(' ').trim();
  r.candidatos = buscarItems(r.desc, ctx.items || []);
  if (r.candidatos.length) r.tipo = 'fijo';
  return r;
}

function isoM(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2); }
function isoD(d) { return isoM(d) + '-' + ('0' + d.getDate()).slice(-2); }

/** Mes en que impacta un gasto eventual (tarjeta → mes siguiente). */
function mesImpacto(fechaIso, medio, tarjetaMesSig) {
  var f = new Date(fechaIso + 'T12:00:00');
  var sig = tarjetaMesSig && /tarjeta|visa|amex|master/.test(normP(medio));
  return isoM(new Date(f.getFullYear(), f.getMonth() + (sig ? 1 : 0), 1));
}

/* ---- Fechas y meses ---- */
function sumarMesP(iso, k) {
  var p = String(iso).split('-'), d = new Date(Number(p[0]), Number(p[1]) - 1 + k, 1);
  return isoM(d);
}

function etiquetaMesP(iso) {
  var p = String(iso).split('-'), s = MESES_P[Number(p[1]) - 1];
  return s.charAt(0).toUpperCase() + s.slice(1) + ' ' + p[0];
}

/** Meses de la línea de tiempo (igual que el servidor). */
function lineaDeTiempoP(valoresIdx, hoyIso, horizonte) {
  var hoy = hoyIso.slice(0, 7), min = sumarMesP(hoy, -12);
  Object.keys(valoresIdx).forEach(function (cid) { Object.keys(valoresIdx[cid]).forEach(function (m) { if (m < min) min = m; }); });
  var fin = sumarMesP(hoy, horizonte);
  var out = [];
  for (var m = min.slice(0, 4) + '-01'; m <= fin.slice(0, 4) + '-12'; m = sumarMesP(m, 1)) out.push(m);
  return out;
}

/* ---- Datos ---- */
/** [[concepto, mes, monto, cuenta, estimado]] → {concepto: {mes: {m, c, e}}} */
function indexarValoresP(filas) {
  var idx = {};
  (filas || []).forEach(function (r) { (idx[r[0]] = idx[r[0]] || {})[r[1]] = { m: r[2], c: r[3] || '', e: r[4] ? 1 : 0 }; });
  return idx;
}

var ORDEN_CLASE = { I: 0, G: 1, A: 2 };
function grupoIdx(clase) { return ORDEN_CLASE.hasOwnProperty(clase) ? ORDEN_CLASE[clase] : 1; }

/**
 * Filas de la grilla, agrupadas en ingresos → gastos → ahorro: cada categoría (con su color) y debajo sus conceptos.
 * Cada fila lleva `grupo` (I, G, A; null en la fila de categoría nueva).
 * @param {Object} opts {colapsadas:{nombre:true}, visible:function(concepto):bool, nuevos:[{t:'nuevo', categoria}|{t:'nuevacat'}]}
 */
function construirFilas(conceptos, categorias, opts) {
  opts = opts || {};
  var colapsadas = opts.colapsadas || {}, visible = opts.visible || function () { return true; }, nuevos = opts.nuevos || [];
  var orden = function (a, b) { return a.orden - b.orden; };
  var cats = categorias.slice();
  conceptos.forEach(function (c) {
    if (!cats.some(function (k) { return k.nombre === c.categoria; })) cats.push({ nombre: c.categoria, clase: c.clase, tipo: c.tipo, color: '', orden: 1e9 });
  });
  cats.sort(function (a, b) { return grupoIdx(a.clase) - grupoIdx(b.clase) || a.orden - b.orden; });
  var filas = [];
  cats.forEach(function (cat) {
    var items = conceptos.filter(function (c) { return c.categoria === cat.nombre; }).sort(orden);
    var grupo = ['I', 'G', 'A'][grupoIdx(cat.clase)];
    filas.push({ t: 'cat', cat: cat, key: cat.nombre, conceptos: items, grupo: grupo, cerrada: !!colapsadas[cat.nombre] });
    if (colapsadas[cat.nombre]) return;
    items.forEach(function (c) { if (visible(c)) filas.push({ t: 'item', c: c, cat: cat, grupo: grupo }); });
    nuevos.forEach(function (n) { if (n.t === 'nuevo' && n.categoria === cat.nombre) filas.push({ t: 'nuevo', categoria: cat.nombre, cat: cat, grupo: grupo }); });
  });
  nuevos.forEach(function (n) { if (n.t === 'nuevacat') filas.push({ t: 'nuevacat', grupo: null }); });
  return filas;
}

var ABREV_MEDIO = { 'debito automatico': 'DA', transferencia: 'T', efectivo: 'EF', 'mercado pago': 'MP' };

/** Medio de pago abreviado para mostrar junto al nombre: DA, T, EF, MP, VISA, AMEX… */
function abrevMedio(medio) {
  var m = String(medio || '').trim();
  if (!m) return '';
  return ABREV_MEDIO[normP(m)] || m.replace(/^tarjeta\s+/i, '');
}

/** Fórmula (igual que el servidor): "Ingresos*20%" · "Gastos+1000000" · "#<id>-500000" → {base:'I'|'G'|id, op:'%'|'+'|'-', n}. */
function parsearFormulaP(texto) {
  var m = /^=?\s*(ingresos|gastos|#[\w-]+)\s*([*+\-])\s*([\d.,]+)\s*(%?)\s*$/i.exec(String(texto || ''));
  if (!m) return null;
  var op = m[2] === '*' ? '%' : m[2];
  if ((op === '%') !== (m[4] === '%')) return null;
  var t = m[3];
  if (/^\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, '');
  else if (t.indexOf(',') >= 0) t = t.replace(/\./g, '').replace(',', '.');
  var n = Number(t);
  if (!(n > 0) || (op === '%' && n > 1000)) return null;
  var b = m[1].toLowerCase();
  return { base: b === 'ingresos' ? 'I' : b === 'gastos' ? 'G' : m[1].slice(1), op: op, n: n };
}
function textoFormula(base, op, n) {
  return (base === 'I' ? 'Ingresos' : base === 'G' ? 'Gastos' : '#' + base) + (op === '%' ? '*' + n + '%' : op + n);
}
/** "20% de Ingresos" · "Gastos + $ 1.000.000" · "Salario − $ 500.000". */
function describirFormula(texto, conceptos) {
  var f = parsearFormulaP(texto);
  if (!f) return '';
  var ref = f.base === 'I' || f.base === 'G' ? null : (conceptos || []).filter(function (x) { return x.id === f.base; })[0];
  var nombre = f.base === 'I' ? 'Ingresos' : f.base === 'G' ? 'Gastos' : ref ? ref.nombre : '(concepto borrado)';
  if (f.op === '%') return String(f.n).replace('.', ',') + '% de ' + nombre;
  return nombre + (f.op === '+' ? ' + $ ' : ' − $ ') + Math.round(f.n).toLocaleString('es-AR');
}

/**
 * ¿La fila está archivada para el mes elegido? (se oculta salvo "Mostrar archivados")
 *  - Gasto eventual: no tiene monto en ese mes.
 *  - Concepto fijo: todos sus montos son de meses anteriores (se dejó de pagar).
 * Las filas sin ningún monto (recién creadas, Aguinaldo, Bonos…) nunca se archivan. Los montos en 0 no cuentan.
 */
function estaArchivado(c, porMes, mes) {
  var meses = Object.keys(porMes || {}).filter(function (m) { return porMes[m] && Math.abs(Number(porMes[m].m)) >= 0.5; });
  if (!meses.length) return false;
  if (c.tipo === 'eventual') return meses.indexOf(mes) < 0;
  return meses.every(function (m) { return m < mes; });
}

/** Indicación de cómo se completan los meses futuros (fórmula ƒx o modo distinto de "Repetir"). */
function resumenConcepto(c) {
  if (c.tipo !== 'fijo') return '';
  var f = parsearFormulaP(c.formula);
  if (f) return 'ƒx' + (f.op === '%' ? ' ' + String(f.n).replace('.', ',') + '%' : '');
  return c.proyeccion === 'Promedio 3 meses' ? 'prom.' : c.proyeccion === 'Ajustar por inflación' ? '+infl.' : '';
}

/**
 * Selector de vencimiento del panel → regla en palabras (la que entiende el servidor).
 * @param {{dia:number|string, fin:''|'ultimo'|'anteultimo', habil:boolean}} v
 */
function reglaDesdeSelector(v) {
  if (v.fin === 'ultimo') return v.habil ? 'último hábil' : 'último día';
  if (v.fin === 'anteultimo') return v.habil ? 'anteúltimo hábil' : 'anteúltimo día';
  var d = Number(v.dia);
  if (!d || d < 1) return '';
  d = Math.min(28, Math.round(d));
  return d + (v.habil ? ' hábil' : '');
}

/** Regla guardada → valores del selector. {otra:true} si la regla no entra en el selector (ej. "primer lunes"). */
function selectorDesdeRegla(texto) {
  var t = normP(texto), m;
  if (!t) return { dia: '', fin: '', habil: false };
  if ((m = /^(\d{1,2})( habil)?$/.exec(t)) && Number(m[1]) >= 1 && Number(m[1]) <= 28) return { dia: Number(m[1]), fin: '', habil: !!m[2] };
  if (/^(1|1er|1ro|primer|primero) (dia )?habil$/.test(t)) return { dia: 1, fin: '', habil: true };
  if ((m = /^(ultimo|anteultimo) (dia|habil)$/.exec(t))) return { dia: '', fin: m[1], habil: m[2] === 'habil' };
  return { dia: '', fin: '', habil: false, otra: true };
}

/** Día del mes en que se paga el concepto ese mes (varía: 28/30/31, hábiles, feriados), o null. */
function diaDePago(venc, cid, mes) {
  var f = venc && venc[cid] && venc[cid][mes];
  return f ? Number(f.slice(8)) : null;
}

/** "900k 6c", "900000 x6", "900k en 6 cuotas" → {texto:'900k', cuotas:6}; null si no hay cuotas. */
function cuotasEnCelda(texto) {
  var m = /^(.*?\S)(?:\s+en\s+|\s*x\s*|\s+)(\d{1,2})\s*(?:c|cuotas?|ctas?)\s*$/i.exec(String(texto || '').trim()) ||
    /^(.*?\S)\s+x\s*(\d{1,2})\s*$/i.exec(String(texto || '').trim());
  if (!m || !montoP(m[1])) return null;
  var n = Number(m[2]);
  return n >= 2 && n <= 60 ? { texto: m[1], cuotas: n } : null;
}

/** Texto crudo para editar una celda: la cuenta ("=100+50") o el número. */
function textoCrudo(v) {
  if (!v) return '';
  if (v.c) return '=' + v.c;
  return String(v.m).replace('.', ',');
}

/* ---- Cálculos del tablero ---- */
/* Cálculos puros del dashboard (testeables en Node). */
var MESES_D = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];

function etiquetaCorta(iso) { var p = iso.split('-'); return MESES_D[Number(p[1]) - 1] + ' ' + p[0].slice(2); }

function sumarMeses(iso, k) {
  var p = iso.split('-'), d = new Date(Number(p[0]), Number(p[1]) - 1 + k, 1);
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2);
}

/** Índice de precios acumulado por mes (primer mes = 100). Completa con la inflación esperada. */
function indicePrecios(meses, inflacion, esperada) {
  var idx = {}, nivel = 100, faltantes = [];
  meses.forEach(function (m, i) {
    if (i > 0) {
      var p = inflacion[m];
      if (p === undefined || p === null || p === '') { p = esperada; faltantes.push(m); }
      nivel = nivel * (1 + Number(p) / 100);
    }
    idx[m] = nivel;
  });
  return { idx: idx, estimados: faltantes };
}

/** Cotización para cada mes (si falta, la última conocida). */
function cotizaciones(meses, mapa) {
  var out = {}, ult = null;
  var claves = Object.keys(mapa || {}).sort();
  meses.forEach(function (m) {
    if (mapa[m]) ult = mapa[m];
    else if (ult === null) { var ant = claves.filter(function (k) { return k <= m; }).pop(); ult = ant ? mapa[ant] : (claves.length ? mapa[claves[0]] : null); }
    out[m] = ult;
  });
  return out;
}

/** Convierte un valor según la moneda elegida. */
function convertir(v, mes, modo, ctx) {
  if (v === null || v === undefined) return null;
  if (modo === 'real') return v * ctx.idx[ctx.ref] / ctx.idx[mes];
  if (modo === 'usd') return ctx.usd[mes] ? v / ctx.usd[mes] : null;
  return v;
}

/** Suma por mes de un conjunto de ítems. */
function serieSuma(items, iMeses, incluirEst) {
  return iMeses.map(function (i) {
    var s = 0, hay = false;
    items.forEach(function (it) {
      var v = it.v[i];
      if (v === null || v === undefined || (!incluirEst && it.e[i])) return;
      s += v; hay = true;
    });
    return hay ? s : null;
  });
}

/** Variación porcentual entre el primer y el último valor no nulo y positivo. */
function variacion(serie) {
  var a = null, b = null, ia = -1, ib = -1;
  serie.forEach(function (v, i) { if (v) { if (a === null) { a = v; ia = i; } b = v; ib = i; } });
  return a && b && ib > ia ? { pct: (b / a - 1) * 100, desde: ia, hasta: ib, a: a, b: b } : null;
}

/** Tabla de precios: aumento de cada gasto fijo contra la inflación del mismo período. */
function tablaPrecios(items, meses, iMeses, idx, incluirEst) {
  return items.map(function (it) {
    var serie = iMeses.map(function (i) { return !incluirEst && it.e[i] ? null : it.v[i]; });
    var va = variacion(serie);
    if (!va) return null;
    var mA = meses[iMeses[va.desde]], mB = meses[iMeses[va.hasta]];
    var infl = (idx[mB] / idx[mA] - 1) * 100;
    var real = ((1 + va.pct / 100) / (1 + infl / 100) - 1) * 100;
    return { nombre: it.nombre, categoria: it.categoria, desde: mA, hasta: mB, a: va.a, b: va.b, pct: va.pct, infl: infl, real: real };
  }).filter(Boolean);
}

/** Datos del tablero a partir del modelo de la app. */
function datosTablero(st) {
  var meses = st.meses;
  var items = st.conceptos.map(function (c) {
    return {
      nombre: c.nombre, categoria: c.categoria, clase: c.clase, mov: c.tipo === 'eventual', medio: c.medio,
      v: meses.map(function (m) { var y = st.V[c.id] && st.V[c.id][m]; return y ? Math.round(y.m) : null; }),
      e: meses.map(function (m) { var y = st.V[c.id] && st.V[c.id][m]; return y && y.e ? 1 : 0; })
    };
  });
  var infl = {}, oficial = {}, blue = {};
  (st.indices || []).forEach(function (r) {
    if (r.inflacion !== '' && r.inflacion !== null && !isNaN(Number(r.inflacion))) infl[r.mes] = Number(r.inflacion);
    if (Number(r.dolar_oficial)) oficial[r.mes] = Number(r.dolar_oficial);
    if (Number(r.dolar_blue)) blue[r.mes] = Number(r.dolar_blue);
  });
  var hoy = st.hoy, mesHoy = hoy.slice(0, 7);
  var proximos = [];
  st.conceptos.forEach(function (c) {
    var f = st.venc[c.id] && st.venc[c.id][mesHoy];
    var v = st.V[c.id] && st.V[c.id][mesHoy];
    if (f && f >= hoy && v && v.m) proximos.push({ nombre: c.nombre, fecha: f, valor: v.m, estimado: !!v.e });
  });
  proximos.sort(function (a, b) { return a.fecha < b.fecha ? -1 : 1; });
  var colores = {};
  (st.categorias || []).forEach(function (c) { colores[c.nombre] = c.color; });
  return { generado: hoy, mesActual: mesHoy, meses: meses, items: items, colores: colores, inflacion: infl, oficial: oficial, blue: blue,
    inflEsperada: st.inflEsperada, dolar: st.cfg.dolar, proximos: proximos.slice(0, 8) };
}

</script>
