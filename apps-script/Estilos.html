<style>
  :root {
    color-scheme: light;
    --page: #F4F5F7; --surface: #FFFFFF; --surface2: #F8FAFC; --surface3: #F1F5F9; --line: #E4E7EC; --grid: #EEF0F3; --axis: #C3C2B7;
    --ink: #0B1220; --ink2: #475467; --muted: #8A94A6;
    --accent: #4F46E5; --accent-soft: #EEF2FF; --accent-ink: #3730A3; --sel: rgba(79,70,229,.10);
    --good: #0CA30C; --good-ink: #067647; --good-soft: #ECFDF3; --critical: #D03B3B; --critical-ink: #B42318; --critical-soft: #FEF3F2;
    --warn-ink: #93370D; --warn-soft: #FEF6E7;
    --sec-I: #067647; --sec-I-bg: #ECFDF3; --sec-G: #344054; --sec-G-bg: #F2F4F7; --sec-A: #1D4ED8; --sec-A-bg: #EFF4FF; --sec-E: #B54708; --sec-E-bg: #FFF6ED;
    --s1: #2A78D6; --s2: #EB6834; --s3: #1BAF7A; --s4: #EDA100; --s5: #E87BA4; --s6: #008300; --s7: #4A3AA7; --s8: #E34948; --otros: #A8A7A1;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 1px rgba(16,24,40,.03);
    --shadow-lg: 0 12px 32px rgba(16,24,40,.16);
    --radius: 12px;
    --row: 30px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0D0F12; --surface: #16181C; --surface2: #1C1F24; --surface3: #22262C; --line: #2B3038; --grid: #22262C; --axis: #383835;
      --ink: #F2F4F7; --ink2: #C3C9D2; --muted: #8A94A6;
      --accent: #818CF8; --accent-soft: #23234A; --accent-ink: #C7D2FE; --sel: rgba(129,140,248,.18);
      --good-ink: #32D583; --good-soft: #0F2A1A; --critical-ink: #F97066; --critical-soft: #3A1717; --warn-ink: #FDB022; --warn-soft: #33240D;
      --sec-I: #32D583; --sec-I-bg: #0F2A1A; --sec-G: #D0D5DD; --sec-G-bg: #1F242B; --sec-A: #84ADFF; --sec-A-bg: #14213D; --sec-E: #FDB022; --sec-E-bg: #2E2110;
      --s1: #3987E5; --s2: #D95926; --s3: #199E70; --s4: #C98500; --s5: #D55181; --s6: #008300; --s7: #9085E9; --s8: #E66767; --otros: #6B6A66;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--page); color: var(--ink); font: 14px/1.45 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }
  [hidden] { display: none !important; }

  /* ---------- Barra superior ---------- */
  .top { display: flex; align-items: center; gap: 14px; padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--line); flex: none; }
  .marca { font-weight: 700; font-size: 16px; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .nav { display: flex; gap: 2px; background: var(--surface3); padding: 3px; border-radius: 10px; }
  .nav button { border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; font-weight: 600; font-size: 13px; color: var(--ink2); display: flex; gap: 6px; align-items: center; }
  .nav button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
  .espacio { flex: 1; }
  .estado-guardado { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .estado-guardado i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); display: inline-block; }
  .estado-guardado.guardando i { background: var(--s4); animation: pulso 1s infinite; }
  .estado-guardado.error i { background: var(--critical); }
  @keyframes pulso { 50% { opacity: .3; } }
  .enlace { font-size: 12px; color: var(--ink2); text-decoration: none; border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; white-space: nowrap; }
  .enlace:hover { border-color: var(--accent); color: var(--accent-ink); }

  main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .vista { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .vista.scroll { overflow: auto; }
  .contenido { max-width: 1240px; width: 100%; margin: 0 auto; padding: 18px 16px 48px; }

  /* ---------- Planilla ---------- */
  .barra { display: flex; gap: 10px; align-items: center; padding: 10px 16px; flex-wrap: wrap; flex: none; }
  .rapida { position: relative; flex: 1 1 360px; max-width: 620px; }
  .rapida input { width: 100%; border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 12px 9px 36px; font-size: 14px; }
  .rapida input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .rapida::before { content: "⚡"; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 14px; opacity: .8; }
  .vista-previa { position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-lg); padding: 10px 12px; z-index: 30; font-size: 13px; }
  .vista-previa .fila { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .vista-previa .monto { font-size: 18px; font-weight: 700; }
  .vista-previa .nota { color: var(--ink2); margin-top: 6px; }
  .vista-previa kbd { font: 11px ui-monospace, monospace; background: var(--surface3); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 1px 5px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--surface3); color: var(--ink2); white-space: nowrap; }
  .chip[style*="--cat"] { background: color-mix(in srgb, var(--cat) 14%, var(--surface)); color: var(--cat); }
  .boton { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 7px 12px; font-size: 13px; font-weight: 600; color: var(--ink2); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .boton:hover { border-color: var(--accent); color: var(--accent-ink); }
  .boton.primario { background: var(--accent); border-color: var(--accent); color: #fff; }
  .boton.primario:hover { filter: brightness(1.08); color: #fff; }
  .boton.peligro { color: var(--critical-ink); }
  .boton.peligro:hover { border-color: var(--critical); }
  .boton:disabled { opacity: .5; cursor: default; }
  .leyenda-celdas { display: flex; gap: 12px; font-size: 12px; color: var(--muted); align-items: center; }
  .leyenda-celdas b { color: var(--ink); font-weight: 600; }
  .leyenda-celdas em { color: var(--muted); }

  .grilla-wrap { flex: 1; min-height: 0; margin: 0 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow); }
  .grilla { flex: 1; overflow: auto; position: relative; outline: none; }
  table.g { border-collapse: separate; border-spacing: 0; font-size: 13px; }
  table.g th, table.g td { height: var(--row); padding: 0 10px; white-space: nowrap; border-bottom: 1px solid var(--grid); border-right: 1px solid var(--grid); background: var(--surface); }
  table.g td.m, table.g th.m { min-width: 104px; max-width: 104px; text-align: right; font-variant-numeric: tabular-nums; }
  table.g td.t, table.g th.t { min-width: 118px; text-align: right; font-weight: 700; background: var(--surface2); font-variant-numeric: tabular-nums; }
  table.g .n { position: sticky; left: 0; z-index: 2; min-width: 290px; max-width: 290px; overflow: hidden; text-overflow: ellipsis; text-align: left; border-right: 1px solid var(--line); }
  table.g thead th { position: sticky; z-index: 3; }
  table.g thead tr.anios th { top: 0; height: 26px; background: var(--surface3); color: var(--ink2); font-size: 11px; font-weight: 700; letter-spacing: .04em; cursor: pointer; text-align: center; }
  table.g thead tr.anios th:hover { color: var(--accent-ink); }
  table.g thead tr.meses th { top: 26px; height: 30px; font-size: 12px; font-weight: 600; color: var(--ink2); text-transform: capitalize; border-bottom: 1px solid var(--line); }
  table.g thead tr.res th, table.g thead tr.res td { height: 28px; }
  table.g thead tr.res1 > * { top: 56px; } table.g thead tr.res2 > * { top: 84px; } table.g thead tr.res3 > * { top: 112px; } table.g thead tr.res4 > * { top: 140px; border-bottom: 2px solid var(--line); }
  table.g thead tr.res > * { position: sticky; z-index: 3; font-weight: 700; }
  table.g thead .n, table.g thead tr.res > .n { z-index: 6; }
  table.g thead tr.anios .n, table.g thead tr.meses .n { text-align: left; }
  table.g th.hoy { background: var(--accent) !important; color: #fff !important; }
  table.g td.hoy { box-shadow: inset 0 0 0 9999px var(--sel); }
  table.g tr.res td.neg { color: var(--critical-ink); }
  table.g tr.res td.pos { color: var(--good-ink); }
  .res-et { display: flex; align-items: center; gap: 8px; }
  .res-et i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }

  table.g tr.cat > * { background: color-mix(in srgb, var(--cat) 9%, var(--surface)); font-weight: 700; color: var(--ink2); height: 34px; border-top: 6px solid var(--surface); }
  table.g tbody tr.cat:first-child > * { border-top: 0; }
  table.g tr.cat .n { color: var(--cat); box-shadow: inset 5px 0 0 var(--cat); font-size: 13.5px; }
  table.g tr.cat .n .tn { color: var(--cat); letter-spacing: .01em; display: inline-block; max-width: calc(100% - 116px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: middle; }
  .punto { width: 9px; height: 9px; border-radius: 3px; background: var(--cat); display: inline-block; margin-right: 8px; flex: none; }
  table.g td.n { display: table-cell; }
  table.g tr.cat .n { padding-right: 6px; text-overflow: clip; white-space: nowrap; }
  .cuenta-filas { font-size: 11px; font-weight: 600; color: var(--muted); margin-left: 6px; }
  .mas { border: 1px solid transparent; background: transparent; color: inherit; font-weight: 700; font-size: 14px; line-height: 1; width: 22px; height: 22px; border-radius: 6px; margin-left: 6px; vertical-align: middle; opacity: .55; }
  .mas.txt { width: auto; font-size: 11px; padding: 0 6px; text-transform: none; letter-spacing: 0; }
  tr:hover .mas, .mas:focus-visible { opacity: 1; border-color: currentColor; }
  .mas:hover { background: var(--surface); }
  table.g tr.cat .mas { color: var(--cat); opacity: .8; border-color: color-mix(in srgb, var(--cat) 35%, transparent); }
  table.g tr.cat .mas:hover { background: var(--cat); color: #fff; opacity: 1; }
  table.g tr.agregar-cat td { height: 38px; border-top: 6px solid var(--surface); }
  table.g tr.agregar-cat .mas { opacity: .7; color: var(--ink2); border-color: var(--line); }
  table.g thead tr.meses .ayuda-n { text-transform: none; }
  table.g td.n .caret { cursor: pointer; }
  table.g tr.nueva td.n { color: var(--muted); font-style: italic; }
  .placeholder { color: var(--muted); font-style: italic; font-weight: 400; }
  table.g th.foco { box-shadow: inset 0 -3px 0 var(--accent); color: var(--accent-ink); }
  table.g th.hoy.foco { box-shadow: inset 0 -3px 0 #fff; }
  table.g td.foco:not(.hoy) { box-shadow: inset 0 0 0 9999px color-mix(in srgb, var(--accent) 5%, transparent); }
  table.g .fin-anio { border-right: 2px solid var(--line); }
  table.g thead tr.anios th.anio span { position: sticky; left: 302px; padding: 0 8px; }
  table.g thead tr.anios th.anio { text-align: left; }
  .ayuda-n { font-size: 11px; font-weight: 500; color: var(--muted); }
  .selector-mes { display: flex; align-items: center; gap: 4px; }
  .selector-mes select { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 7px 10px; font-size: 13px; font-weight: 600; min-width: 170px; }
  .boton.icono { width: 34px; justify-content: center; padding: 7px 0; font-size: 16px; }
  #bHoy.activo { background: var(--accent-soft); color: var(--accent-ink); border-color: transparent; }
  .menu.colores { display: grid; grid-template-columns: repeat(5, 36px); min-width: 0; }
  .menu.colores hr, .menu.colores button:last-child { grid-column: 1 / -1; }
  .menu.colores .punto { width: 16px; height: 16px; margin: 0; }
  .caret { display: inline-block; width: 14px; transition: transform .15s; color: var(--muted); }
  .cerrado .caret { transform: rotate(-90deg); }
  table.g tr.item .n { padding-left: 24px; cursor: cell; box-shadow: inset 4px 0 0 color-mix(in srgb, var(--cat) 45%, transparent); }
  table.g tr.item.ev .n { font-size: 12.5px; }
  table.g tr.item .n .tn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  table.g tr.item .n .dia { margin-left: 5px; font-size: 11.5px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
  table.g tr.item .n .meta { float: right; max-width: 38%; margin-left: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; font-weight: 500;
    color: var(--muted); line-height: 20px; }
  table.g tr.item .n .lapiz { float: right; width: 22px; height: 20px; margin-left: 4px; border: 1px solid transparent; border-radius: 6px; background: transparent; color: var(--muted);
    font-size: 13px; line-height: 1; padding: 0; opacity: .35; cursor: pointer; }
  table.g tr.item:hover .n .lapiz, table.g td.n.cur .lapiz, .lapiz:focus-visible { opacity: 1; color: var(--cat); border-color: color-mix(in srgb, var(--cat) 40%, transparent); }
  table.g tr.item .n .lapiz:hover { background: var(--cat); color: #fff; }
  .panel { position: fixed; top: 0; right: 0; bottom: 0; z-index: 50; width: 380px; max-width: 100vw; background: var(--surface); border-left: 1px solid var(--line);
    box-shadow: -12px 0 32px rgba(15, 23, 42, .14); display: flex; flex-direction: column; animation: entraPanel .16s ease-out; }
  @keyframes entraPanel { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
  .panel-cab { display: flex; align-items: center; gap: 10px; padding: 16px 16px 14px; border-bottom: 1px solid var(--line); box-shadow: inset 0 4px 0 var(--cat); }
  .panel-cab .punto { width: 12px; height: 12px; margin: 0; }
  .panel-tit { flex: 1; min-width: 0; }
  .panel-tit h2 { margin: 0; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .panel-tit span { font-size: 12px; color: var(--muted); }
  .panel-cuerpo { flex: 1; min-height: 0; overflow: auto; padding: 16px; display: grid; gap: 16px; align-content: start; }
  .campo-p { display: grid; gap: 6px; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .campo-p input, .campo-p select { font: inherit; font-size: 14px; font-weight: 500; text-transform: none; letter-spacing: 0; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; }
  .campo-p input.num { text-align: right; font-variant-numeric: tabular-nums; }
  .campo-p input:focus, .campo-p select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .ayuda-p { font-size: 12px; font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--ink2); line-height: 1.45; }
  .ayuda-p b { color: var(--ink); font-weight: 600; }
  .ayuda-p.error { color: var(--critical-ink); }
  table.g tr.item .n .dia.medio { margin-left: 3px; }
  table.g tr.cat .lapiz { width: 22px; height: 22px; margin-left: 6px; border: 1px solid transparent; border-radius: 6px; background: transparent; color: var(--cat);
    font-size: 13px; line-height: 1; padding: 0; opacity: .45; vertical-align: middle; cursor: pointer; }
  table.g tr.cat:hover .lapiz, table.g td.n.cur .lapiz, table.g tr.cat .lapiz:focus-visible { opacity: 1; border-color: color-mix(in srgb, var(--cat) 40%, transparent); }
  table.g tr.cat .lapiz:hover { background: var(--cat); color: #fff; }
  .vence-sel { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
  .dia-sel { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--ink2); text-transform: none; letter-spacing: 0; }
  .campo-p .dia-sel input { width: 76px; text-align: center; font-variant-numeric: tabular-nums; }
  .campo-p input:disabled { background: var(--surface3); color: var(--muted); }
  .check { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 500; color: var(--ink); text-transform: none; letter-spacing: 0; cursor: pointer; }
  .check input { width: 17px; height: 17px; accent-color: var(--accent); margin: 0; flex: none; }
  .check.habil { align-items: flex-start; }
  .check.habil input { margin-top: 1px; }
  .check.habil b { font-weight: 600; }
  .ayuda-p.aviso-p { background: var(--surface3); border-radius: 8px; padding: 6px 9px; }
  .colores-p { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .color-p { width: 30px; height: 30px; border-radius: 9px; border: 2px solid var(--surface); background: var(--cat); box-shadow: 0 0 0 1px var(--line); cursor: pointer; padding: 0; }
  .color-p.activo { box-shadow: 0 0 0 2px var(--ink); }
  .color-libre { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; text-transform: none; letter-spacing: 0; color: var(--ink2); cursor: pointer; }
  .color-libre input { width: 30px; height: 30px; padding: 0; border: 1px solid var(--line); border-radius: 9px; background: none; cursor: pointer; }
  .seg-p { display: inline-flex; background: var(--surface3); border-radius: 10px; padding: 3px; gap: 2px; width: max-content; }
  .seg-p button { border: 0; background: transparent; padding: 7px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--ink2); text-transform: none; letter-spacing: 0; }
  .seg-p button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
  .panel-pie { display: flex; gap: 8px; align-items: center; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--surface2); }
  @media (min-width: 1100px) { body.con-panel .grilla-wrap { margin-right: 396px; } }
  table.g td.est { color: var(--muted); font-style: italic; }
  table.g td.cta { background-image: linear-gradient(225deg, var(--s4) 5px, transparent 5px); }
  table.g td.ed { cursor: cell; }
  table.g td.sel { box-shadow: inset 0 0 0 9999px var(--sel); }
  table.g td.cur { outline: 2px solid var(--accent); outline-offset: -2px; }
  table.g td.vence { position: relative; }
  table.g td.vence::after { content: attr(data-dia); position: absolute; left: 5px; top: 50%; transform: translateY(-50%); font-size: 10px; font-style: normal; color: var(--muted); font-weight: 600; }
  table.g td.vence.vencido::after { color: var(--critical-ink); }
  .editor.txt { text-align: left; }
  .editor { position: absolute; z-index: 20; border: 2px solid var(--accent); background: var(--surface); padding: 0 8px; font: inherit; font-size: 13px; text-align: right; outline: none; box-shadow: var(--shadow-lg); }
  .pie { display: flex; gap: 16px; align-items: center; padding: 6px 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink2); background: var(--surface2); flex: none; min-height: 32px; }
  .pie b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .pie .ayuda { margin-left: auto; color: var(--muted); }
  .espacio-pie { height: 12px; flex: none; }

  /* ---------- Paneles laterales, menús, avisos ---------- */
  .cerrar { border: 0; background: transparent; font-size: 20px; line-height: 1; color: var(--muted); padding: 4px 8px; border-radius: 8px; }
  .cerrar:hover { background: var(--surface3); }
  .campo { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .campo label { font-size: 12px; font-weight: 600; color: var(--ink2); }
  .campo .ayuda { font-size: 12px; color: var(--muted); }
  .campo input, .campo select, .campo textarea { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; font-size: 14px; width: 100%; }
  .campo input:focus, .campo select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .fila2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .menu { position: fixed; z-index: 50; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-lg); padding: 4px; min-width: 200px; }
  .menu button { display: flex; width: 100%; border: 0; background: transparent; padding: 8px 10px; border-radius: 7px; font-size: 13px; text-align: left; gap: 8px; }
  .menu button:hover { background: var(--surface3); }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
